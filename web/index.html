<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime DNA - Prvočíselná databáze</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { color: #00d4ff; margin-bottom: 5px; }
    .subtitle { color: #888; margin-bottom: 20px; }
    .stats {
      background: #16213e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-family: monospace;
    }
    .stats span { color: #00d4ff; }
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 0;
      padding-left: 10px;
    }
    .tab {
      padding: 8px 16px;
      border: 2px solid #333;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      background: #0a0a18;
      color: #666;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      margin-right: 2px;
      position: relative;
      top: 2px;
    }
    .tab:hover { color: #aaa; background: #0f0f23; }
    .tab.active {
      background: #0f0f23;
      color: #00d4ff;
      border-color: #444;
      z-index: 1;
    }
    .tab small { display: block; font-size: 10px; color: #555; margin-top: 2px; }
    .tab.active small { color: #00d4ff; opacity: 0.7; }
    .input-panel {
      border: 2px solid #444;
      border-radius: 0 8px 8px 8px;
      background: #0f0f23;
      padding: 15px;
    }
    input {
      width: 100%;
      padding: 15px;
      font-size: 24px;
      border: none;
      border-radius: 6px;
      background: #1a1a2e;
      color: #fff;
      text-align: center;
      -moz-appearance: textfield;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input:focus { outline: 2px solid #00d4ff; outline-offset: -2px; }
    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 6px;
      font-size: 20px;
      text-align: center;
    }
    .prime { background: #0a3d0a; color: #4cff4c; }
    .composite { background: #3d0a0a; color: #ff4c4c; }
    .info { background: #16213e; color: #aaa; }
    .neutral { background: #1a1a3e; color: #00d4ff; }
    .detail {
      margin-top: 10px;
      font-size: 14px;
      color: #888;
    }
    .detail span { color: #00d4ff; }
    .dna-preview {
      margin-top: 30px;
      padding: 15px;
      background: #0f0f23;
      border-radius: 8px;
      font-family: monospace;
      font-size: 10px;
      word-break: break-all;
      max-height: 100px;
      overflow: auto;
      color: #666;
    }
    footer { margin-top: 30px; text-align: center; color: #444; font-size: 12px; }
    a { color: #00d4ff; }
  </style>
</head>
<body>
  <h1>🧬 Prime DNA</h1>
  <p class="subtitle">Kompaktní prvočíselná databáze zakódovaná v base64</p>

  <div class="stats">
    Načteno: <span id="count">...</span> prvočísel |
    Velikost: <span id="size">...</span> KB |
    Rozsah: 2 – <span id="max">...</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-mode="primeq">
      PrimeQ
      <small>Je n prvočíslo?</small>
    </div>
    <div class="tab" data-mode="prime">
      Prime
      <small>n-té prvočíslo</small>
    </div>
    <div class="tab" data-mode="primepi">
      PrimePi
      <small>π(n) = počet prim ≤ n</small>
    </div>
  </div>

  <div class="input-panel">
    <input type="number" id="input" placeholder="Zadej číslo..." autofocus>
    <div id="result" class="result info">Zadej číslo</div>
  </div>

  <div class="dna-preview" id="dna">Načítám DNA...</div>

  <footer>
    <a href="https://hraj.si">hraj.si</a> |
    DNA = gap/2 encoding, ~1 byte per prime
  </footer>

  <script>
    // Prime DNA implementation
    class PrimeDNA {
      constructor() { this.firstPrime = 2; this.halfGaps = null; }

      fromBase64(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const view = new DataView(bytes.buffer);
        this.firstPrime = view.getUint32(0, true);
        this.halfGaps = bytes.slice(4);
        return this;
      }

      get count() { return this.halfGaps.length + 1; }

      decode() {
        const primes = new Array(this.halfGaps.length + 1);
        let p = this.firstPrime;
        primes[0] = p;
        if (this.halfGaps.length > 0) {
          p += this.halfGaps[0];
          primes[1] = p;
          for (let i = 1; i < this.halfGaps.length; i++) {
            p += 2 * this.halfGaps[i];
            primes[i + 1] = p;
          }
        }
        return primes;
      }
    }

    // Binary search: find index where primes[i] >= n
    function lowerBound(primes, n) {
      let lo = 0, hi = primes.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (primes[mid] < n) lo = mid + 1;
        else hi = mid;
      }
      return lo;
    }

    // Generate DNA
    function sievePrimes(limit) {
      const sieve = new Uint8Array(limit + 1).fill(1);
      sieve[0] = sieve[1] = 0;
      for (let i = 2; i * i <= limit; i++) {
        if (sieve[i]) for (let j = i * i; j <= limit; j += i) sieve[j] = 0;
      }
      return [...sieve.keys()].filter(i => sieve[i]);
    }

    function encodeDNA(primes) {
      const header = new Uint8Array(4);
      new DataView(header.buffer).setUint32(0, primes[0], true);
      const gaps = new Uint8Array(primes.length - 1);
      gaps[0] = primes[1] - primes[0];
      for (let i = 2; i < primes.length; i++) gaps[i-1] = (primes[i] - primes[i-1]) / 2;
      const combined = new Uint8Array(4 + gaps.length);
      combined.set(header);
      combined.set(gaps, 4);
      return btoa(String.fromCharCode(...combined));
    }

    // Czech number formatting (narrow non-breaking space)
    const fmt = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');

    // Initialize
    const limit = 1000000;
    const primesRaw = sievePrimes(limit);
    const dnaB64 = encodeDNA(primesRaw);
    const dna = new PrimeDNA().fromBase64(dnaB64);
    const allPrimes = dna.decode();  // Decode ONCE

    document.getElementById('count').textContent = fmt(allPrimes.length);
    document.getElementById('size').textContent = (dnaB64.length / 1024).toFixed(1);
    document.getElementById('max').textContent = fmt(allPrimes[allPrimes.length - 1]);
    document.getElementById('dna').textContent = dnaB64.slice(0, 500) + '...';

    // Mode handling
    let mode = 'primeq';
    const tabs = document.querySelectorAll('.tab');
    const input = document.getElementById('input');
    const result = document.getElementById('result');

    const placeholders = {
      primeq: 'Je n prvočíslo?',
      prime: 'Které je n-té prvočíslo?',
      primepi: 'Kolik je prvočísel ≤ n?'
    };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        mode = tab.dataset.mode;
        input.placeholder = placeholders[mode];
        handleInput();
      });
    });

    function handleInput() {
      const n = parseInt(input.value);

      if (isNaN(n) || n < 1) {
        result.className = 'result info';
        result.innerHTML = placeholders[mode];
        return;
      }

      if (mode === 'primeq') {
        // PrimeQ: Is n prime?
        if (n > allPrimes[allPrimes.length - 1]) {
          result.className = 'result info';
          result.innerHTML = `${fmt(n)} je mimo rozsah databáze`;
          return;
        }

        const idx = lowerBound(allPrimes, n);
        const isPrime = allPrimes[idx] === n;

        if (isPrime) {
          result.className = 'result prime';
          result.innerHTML = `✓ <strong>${fmt(n)}</strong> JE PRVOČÍSLO
            <div class="detail">Prime(${fmt(idx + 1)}) = ${fmt(n)}</div>`;
        } else {
          const prev = idx > 0 ? allPrimes[idx - 1] : null;
          const next = allPrimes[idx] || null;
          result.className = 'result composite';
          result.innerHTML = `✗ <strong>${fmt(n)}</strong> NENÍ prvočíslo
            <div class="detail">Nejbližší: <span>${prev ? fmt(prev) : '–'}</span> &lt; ${fmt(n)} &lt; <span>${next ? fmt(next) : '–'}</span></div>`;
        }

      } else if (mode === 'prime') {
        // Prime(n): n-th prime
        if (n > allPrimes.length) {
          result.className = 'result info';
          result.innerHTML = `Index ${fmt(n)} je mimo rozsah (max ${fmt(allPrimes.length)})`;
          return;
        }

        const p = allPrimes[n - 1];  // 1-indexed
        result.className = 'result neutral';
        result.innerHTML = `Prime(${fmt(n)}) = <strong>${fmt(p)}</strong>
          <div class="detail">${fmt(n)}. prvočíslo v pořadí</div>`;

      } else if (mode === 'primepi') {
        // PrimePi(n): count of primes ≤ n
        if (n < 2) {
          result.className = 'result neutral';
          result.innerHTML = `π(${n}) = <strong>0</strong>
            <div class="detail">Žádné prvočíslo ≤ ${n}</div>`;
          return;
        }

        const idx = lowerBound(allPrimes, n + 1);  // First prime > n
        const count = idx;

        result.className = 'result neutral';
        result.innerHTML = `π(${fmt(n)}) = <strong>${fmt(count)}</strong>
          <div class="detail">${fmt(count)} prvočísel ≤ ${fmt(n)}</div>`;

        if (n > allPrimes[allPrimes.length - 1]) {
          result.innerHTML += `<div class="detail" style="color:#ff6b6b">⚠ n překračuje rozsah, zobrazeno π(${fmt(allPrimes[allPrimes.length-1])})</div>`;
        }
      }
    }

    input.addEventListener('input', handleInput);
  </script>
</body>
</html>
